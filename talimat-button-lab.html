<script>
(()=>{'use strict';
const assets=JSON.parse(document.getElementById('buttonAssetData').textContent),host=document.getElementById('alternatives'),root=document.documentElement;let mode='normal',dark=false,lastTap=0,streak=0;
const sound=InstructionSound.create({enabled:()=>document.getElementById('soundEnabled').checked}),arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h10L9 6l3-3 9 9-9 9-3-3 4-4H3z"/></svg>',play='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18l15-9z"/></svg>';
for(const item of assets){const section=document.createElement('article');section.className='variant';section.dataset.variant=item.id;section.innerHTML='<div class="variant-heading"><span class="letter">'+item.id+'</span><h2>'+item.title+'</h2></div><div class="sample"><button type="button" class="command" data-state="normal"><span class="icon">'+arrow+'</span><span class="copy"><strong>Talimat ver</strong><span class="counter">30 / 100 · 13. gün</span><span class="match-note">Takımını hazırla · Maç seni bekliyor</span></span><span class="value">+4 AP</span></button></div><p class="variant-note"><span>'+item.note+'</span><output aria-live="polite"></output></p>';const button=section.querySelector('button');button.dataset.count='30';button.dataset.day='13';button.dataset.taps='0';button.setAttribute('aria-label',item.id+' · '+item.title+' · Talimat ver');button.addEventListener('click',()=>{const now=performance.now();streak=now-lastTap<650?streak+1:1;lastTap=now;let count=Number(button.dataset.count),day=Number(button.dataset.day);const completed=mode!=='match'&&count===99;if(mode!=='match'){count=(count+1)%100;if(completed)day++;button.dataset.count=count;button.dataset.day=day;button.dataset.taps=Number(button.dataset.taps)+1;}sound(completed?'day':'tap',streak);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){button.getAnimations().forEach(a=>a.cancel());button.animate([{transform:'translateY(3px)'},{transform:'translateY(0)'}],{duration:140,easing:'ease-out'});}section.querySelector('output').textContent=mode==='match'?'Maç önizlemesi':button.dataset.taps+' talimat';update(button);});host.append(section);}
function skin(item){const palette=dark?item.dark:item.light;return 'url("data:image/svg+xml,'+encodeURIComponent(item.svg.replace(/#[a-f0-9]{6}/gi,c=>palette[c.toUpperCase()]||c))+'")';}
function update(button){button.dataset.state=mode;button.querySelector('strong').textContent=mode==='match'?'Maça geç':'Talimat ver';button.querySelector('.icon').innerHTML=mode==='match'?play:arrow;button.querySelector('.counter').textContent=button.dataset.count+' / 100 · '+button.dataset.day+'. gün';button.querySelector('.value').textContent=mode==='critical'?'KRİTİK! +127,2k AP':'+4 AP';button.style.setProperty('--progress',button.dataset.count+'%');}
function paint(){for(const [i,section]of [...host.children].entries()){section.querySelector('.command').style.setProperty('--skin',skin(assets[i]));update(section.querySelector('.command'));}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));paint();}));
document.getElementById('themeToggle').onclick=e=>{dark=!dark;root.dataset.theme=dark?'dark':'light';e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'Gündüz görünümü':'Gece görünümü';paint();};document.getElementById('previewWidth').addEventListener('input',e=>{root.style.setProperty('--preview-width',e.target.value+'px');document.getElementById('widthValue').value=e.target.value+' px';});paint();
})();
</script>
