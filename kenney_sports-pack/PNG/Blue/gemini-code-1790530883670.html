<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball AI Rally</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 4px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #1e293b;
        }
        .controls-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div class="controls-hint">
            <h2 class="font-bold text-orange-400 mb-1">Volleyball Match</h2>
            <p class="text-sm">Move: <kbd class="bg-gray-700 px-1 rounded">W</kbd> <kbd class="bg-gray-700 px-1 rounded">A</kbd> <kbd class="bg-gray-700 px-1 rounded">S</kbd> <kbd class="bg-gray-700 px-1 rounded">D</kbd></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        const assets = {
            body: { img: new Image(), loaded: false, error: false },
            foot: { img: new Image(), loaded: false, error: false },
            ball: { img: new Image(), loaded: false, error: false }
        };

        assets.body.img.src = 'characterBlue (1).png';
        assets.body.img.onload = () => assets.body.loaded = true;
        assets.body.img.onerror = () => { assets.body.error = true; };

        assets.foot.img.src = 'characterBlue (11).png';
        assets.foot.img.onload = () => assets.foot.loaded = true;
        assets.foot.img.onerror = () => { assets.foot.error = true; };

        assets.ball.img.src = 'ball_volley1.png';
        assets.ball.img.onload = () => assets.ball.loaded = true;
        assets.ball.img.onerror = () => { assets.ball.error = true; };

        class Ball {
            constructor() {
                this.x = 500;
                this.y = 300;
                this.z = 0;
                this.vx = 0;
                this.vy = 0;
                this.vz = 0;
                this.gravity = 0.35;
                this.targetX = 500;
                this.targetY = 300;
                this.state = 'dead';
                this.timer = 60; // 1 saniye bekleme
            }

            serve(startX, startY, toSide) {
                this.x = startX;
                this.y = startY;
                this.z = 30; 
                this.state = 'flying';
                
                if (toSide === 'right') {
                    this.targetX = 600 + Math.random() * 250;
                    this.targetY = 100 + Math.random() * 400;
                } else {
                    this.targetX = 150 + Math.random() * 250;
                    this.targetY = 100 + Math.random() * 400;
                }
                this.calculateTrajectory();
            }

            calculateTrajectory() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                const speed = 5.5; 
                const T = distance / speed;
                
                this.vx = dx / T;
                this.vy = dy / T;
                
                this.vz = (0.5 * this.gravity * T * T - this.z) / T;
            }

            update() {
                if (this.state === 'flying') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;
                    this.vz -= this.gravity;

                    if (this.z <= 0) {
                        this.z = 0;
                        this.checkHit();
                    }
                } else if (this.state === 'dead') {
                    this.timer--;
                    if (this.timer <= 0) {
                        this.resetRally();
                    }
                }
            }

            checkHit() {
                let closest = null;
                let minDest = 9999;
                
                players.forEach(p => {
                    const dist = Math.sqrt((p.x - this.x)**2 + (p.y - this.y)**2);
                    if (dist < minDest) {
                        minDest = dist;
                        closest = p;
                    }
                });

                if (minDest < 50) { 
                    const side = closest.baseX < 500 ? 'right' : 'left';
                    this.x = closest.x;
                    this.y = closest.y;
                    this.z = 25; 
                    
                    if (side === 'right') {
                        this.targetX = 600 + Math.random() * 300;
                        this.targetY = 80 + Math.random() * 440;
                    } else {
                        this.targetX = 100 + Math.random() * 300;
                        this.targetY = 80 + Math.random() * 440;
                    }
                    this.calculateTrajectory();
                    closest.walkTime += 1; 
                } else {
                    this.state = 'dead';
                    this.timer = 90; 
                }
            }

            resetRally() {
                const serverIndex = Math.floor(Math.random() * players.length);
                const server = players[serverIndex];
                const toSide = server.baseX < 500 ? 'right' : 'left';
                this.serve(server.x, server.y, toSide);
            }
            
            draw(ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                const shadowScale = Math.max(0.3, 1 - (this.z / 300));
                ctx.ellipse(this.x, this.y, 12 * shadowScale, 6 * shadowScale, 0, 0, Math.PI*2);
                ctx.fill();

                if (this.state === 'flying') {
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.targetX, this.targetY, 15, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(this.targetX - 5, this.targetY);
                    ctx.lineTo(this.targetX + 5, this.targetY);
                    ctx.moveTo(this.targetX, this.targetY - 5);
                    ctx.lineTo(this.targetX, this.targetY + 5);
                    ctx.stroke();
                }

                if (assets.ball.loaded && !assets.ball.error) {
                    ctx.drawImage(assets.ball.img, this.x - 12, this.y - this.z - 12, 24, 24);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - this.z, 10, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        class Player {
            constructor(baseX, baseY, isUser, angle) {
                this.baseX = baseX;
                this.baseY = baseY;
                this.x = baseX;
                this.y = baseY;
                this.isUser = isUser;
                this.angle = angle;
                this.speed = this.isUser ? 5 : 4.5;
                this.radius = 20;
                this.walkTime = 0;
                this.isMoving = false;
            }

            update() {
                if (this.isUser) {
                    this.updateUser();
                } else {
                    this.updateAI();
                }
            }

            updateUser() {
                let dx = 0;
                let dy = 0;

                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;

                const magnitude = Math.sqrt(dx * dx + dy * dy);
                if (magnitude > 0) {
                    dx /= magnitude;
                    dy /= magnitude;
                    
                    this.isMoving = true;
                    this.angle = Math.atan2(dy, dx);
                    this.walkTime += 0.2;
                } else {
                    this.isMoving = false;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
            }

            updateAI() {
                let targetX = this.baseX;
                let targetY = this.baseY;

                const mySide = this.baseX < 500 ? 'left' : 'right';
                const ballSide = ball.targetX < 500 ? 'left' : 'right';
                
                if (ball.state === 'flying' && mySide === ballSide) {
                    let isClosest = true;
                    let myDist = Math.sqrt((this.x - ball.targetX)**2 + (this.y - ball.targetY)**2);
                    
                    for (let p of players) {
                        if (!p.isUser && p !== this && (p.baseX < 500) === (this.baseX < 500)) {
                            let dist = Math.sqrt((p.x - ball.targetX)**2 + (p.y - ball.targetY)**2);
                            if (dist < myDist) {
                                isClosest = false;
                                break;
                            }
                        }
                    }
                    
                    if (isClosest) {
                        targetX = ball.targetX;
                        targetY = ball.targetY;
                    }
                }

                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 5) {
                    this.isMoving = true;
                    this.angle = Math.atan2(dy, dx);
                    this.walkTime += 0.2;
                    
                    const moveSpeed = Math.min(this.speed, dist); 
                    this.x += (dx / dist) * moveSpeed;
                    this.y += (dy / dist) * moveSpeed;
                } else {
                    this.isMoving = false;
                    this.angle = ball.state === 'flying' ? Math.atan2(ball.y - this.y, ball.x - this.x) : (this.baseX < 500 ? 0 : Math.PI); 
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const maxSwing = 18; 
                const legOffset = 12; 

                let leftSwing = 0;
                let rightSwing = 0;

                if (this.isMoving) {
                    leftSwing = Math.sin(this.walkTime) * maxSwing;
                    rightSwing = Math.sin(this.walkTime + Math.PI) * maxSwing;
                }

                if (assets.foot.loaded && !assets.foot.error) {
                    ctx.drawImage(assets.foot.img, leftSwing - assets.foot.img.width / 2, -legOffset - assets.foot.img.height / 2);
                } else {
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(leftSwing - 8, -legOffset - 6, 16, 12);
                }

                if (assets.foot.loaded && !assets.foot.error) {
                    ctx.drawImage(assets.foot.img, rightSwing - assets.foot.img.width / 2, legOffset - assets.foot.img.height / 2);
                } else {
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(rightSwing - 8, legOffset - 6, 16, 12);
                }

                if (assets.body.loaded && !assets.body.error) {
                    ctx.drawImage(assets.body.img, -assets.body.img.width / 2, -assets.body.img.height / 2);
                } else {
                    ctx.fillStyle = this.isUser ? '#3b82f6' : '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#1e3a8a';
                    ctx.fillRect(0, -5, this.radius + 5, 10);
                }

                ctx.restore();
            }
        }

        const players = [];
        // Left Team (Team A)
        players.push(new Player(350, 150, false, 0)); // NPC Back Left
        players.push(new Player(250, 300, true, 0));  // USER Back Center
        players.push(new Player(350, 450, false, 0)); // NPC Back Right
        players.push(new Player(450, 150, false, 0)); // NPC Front Left
        players.push(new Player(450, 300, false, 0)); // NPC Front Center
        players.push(new Player(450, 450, false, 0)); // NPC Front Right

        // Right Team (Team B)
        players.push(new Player(650, 450, false, Math.PI)); // NPC Back Left
        players.push(new Player(750, 300, false, Math.PI)); // NPC Back Center
        players.push(new Player(650, 150, false, Math.PI)); // NPC Back Right
        players.push(new Player(550, 450, false, Math.PI)); // NPC Front Left
        players.push(new Player(550, 300, false, Math.PI)); // NPC Front Center
        players.push(new Player(550, 150, false, Math.PI)); // NPC Front Right

        const ball = new Ball();

        function drawCourt() {
            const courtWidth = 800;
            const courtHeight = 400;
            const courtX = 100;
            const courtY = 100;

            ctx.fillStyle = '#E5A95F'; 
            ctx.fillRect(courtX, courtY, courtWidth, courtHeight);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(courtX, courtY, courtWidth, courtHeight);

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, courtY);
            ctx.lineTo(canvas.width / 2, courtY + courtHeight);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 133, courtY);
            ctx.lineTo(canvas.width / 2 - 133, courtY + courtHeight);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 + 133, courtY);
            ctx.lineTo(canvas.width / 2 + 133, courtY + courtHeight);
            ctx.stroke();

            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, courtY - 10);
            ctx.lineTo(canvas.width / 2, courtY + courtHeight + 10);
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(canvas.width / 2, courtY - 10, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width / 2, courtY + courtHeight + 10, 5, 0, Math.PI*2); ctx.fill();
        }

        function gameLoop() {
            players.forEach(p => p.update());
            ball.update();
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCourt();
            
            ball.draw(ctx);
            players.forEach(p => p.draw(ctx));
            
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
