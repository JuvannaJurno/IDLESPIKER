<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Court Top-Down</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #game-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 4px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #1e293b;
        }

        .controls-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div class="controls-hint">
            <h2 class="font-bold text-orange-400 mb-1">Volleyball Match</h2>
            <p class="text-sm">Move: <kbd class="bg-gray-700 px-1 rounded">W</kbd> <kbd class="bg-gray-700 px-1 rounded">A</kbd> <kbd class="bg-gray-700 px-1 rounded">S</kbd> <kbd class="bg-gray-700 px-1 rounded">D</kbd></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Input state
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            else if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        const assets = {
            body: { img: new Image(), loaded: false, error: false },
            foot: { img: new Image(), loaded: false, error: false }
        };

        // Load Body (character faces Right inherently)
        assets.body.img.src = 'characterBlue (1).png';
        assets.body.img.onload = () => assets.body.loaded = true;
        assets.body.img.onerror = () => { assets.body.error = true; };

        // Load Foot
        assets.foot.img.src = 'characterBlue (11).png';
        assets.foot.img.onload = () => assets.foot.loaded = true;
        assets.foot.img.onerror = () => { assets.foot.error = true; };

        class Player {
            constructor(x, y, isUser, angle) {
                this.x = x;
                this.y = y;
                this.isUser = isUser;
                this.angle = angle;
                this.speed = 4.5;
                this.radius = 20;
                this.walkTime = 0;
                this.isMoving = false;
                this.currentAmplitude = 0;
            }

            update() {
                if (!this.isUser) return; // NPCs stay in formation

                let dx = 0;
                let dy = 0;

                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;

                const magnitude = Math.sqrt(dx * dx + dy * dy);
                if (magnitude > 0) {
                    // Normalize to prevent double speed on diagonals
                    dx /= magnitude;
                    dy /= magnitude;
                    
                    this.isMoving = true;
                    this.angle = Math.atan2(dy, dx);
                    
                    // Advance walk animation relative to speed
                    this.walkTime += 0.2;
                } else {
                    this.isMoving = false;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // Canvas boundaries
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // EXACT LOGIC RESTORED: The character inherently faces RIGHT in the sprite.
                ctx.rotate(this.angle);

                // Calculate walk animation
                // The legs will move along the X-axis (forward and backward)
                const maxSwing = 18; // How far the foot steps out
                const legOffset = 12; // Distance from center to side of the body (Y-axis)

                // Smoothly interpolate amplitude so legs stop moving when you stop pressing keys
                const targetAmplitude = this.isMoving ? maxSwing : 0;
                this.currentAmplitude += (targetAmplitude - this.currentAmplitude) * 0.15;

                const leftFootX = Math.sin(this.walkTime) * this.currentAmplitude;
                const rightFootX = Math.sin(this.walkTime + Math.PI) * this.currentAmplitude; // Opposite phase

                // 1. Draw Left Foot (Backwards Z-order)
                ctx.save();
                ctx.translate(leftFootX, -legOffset);
                if (assets.foot.loaded && !assets.foot.error) {
                    ctx.drawImage(assets.foot.img, -assets.foot.img.width / 2, -assets.foot.img.height / 2);
                } else {
                    // Fallback: A right-facing oval for a shoe
                    ctx.fillStyle = '#475569';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 2. Draw Right Foot (Backwards Z-order)
                ctx.save();
                ctx.translate(rightFootX, legOffset);
                if (assets.foot.loaded && !assets.foot.error) {
                    ctx.drawImage(assets.foot.img, -assets.foot.img.width / 2, -assets.foot.img.height / 2);
                } else {
                    ctx.fillStyle = '#475569';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 3. Draw Main Body (Rendered ON TOP of the legs)
                ctx.save();
                if (assets.body.loaded && !assets.body.error) {
                    ctx.drawImage(assets.body.img, -assets.body.img.width / 2, -assets.body.img.height / 2);
                } else {
                    // Fallback Right-facing Body
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Head (shifted to the right so it looks like it's looking Forward/+X)
                    ctx.fillStyle = '#fb923c';
                    ctx.beginPath();
                    ctx.arc(8, 0, 10, 0, Math.PI*2); 
                    ctx.fill();
                }
                ctx.restore();

                ctx.restore(); // Restore global context
            }
        }

        const players = [];
        
        function initTeams() {
            // Team Left (Angle 0, facing right)
            players.push(new Player(200, 150, false, 0)); // Back Left
            players.push(new Player(200, 300, true, 0));  // Back Center (USER CONTROLLED)
            players.push(new Player(200, 450, false, 0)); // Back Right
            players.push(new Player(380, 150, false, 0)); // Front Left
            players.push(new Player(380, 300, false, 0)); // Front Center
            players.push(new Player(380, 450, false, 0)); // Front Right

            // Team Right (Angle Math.PI, facing left)
            players.push(new Player(800, 150, false, Math.PI)); // Back Right
            players.push(new Player(800, 300, false, Math.PI)); // Back Center
            players.push(new Player(800, 450, false, Math.PI)); // Back Left
            players.push(new Player(620, 150, false, Math.PI)); // Front Right
            players.push(new Player(620, 300, false, Math.PI)); // Front Center
            players.push(new Player(620, 450, false, Math.PI)); // Front Left
        }

        function drawCourt() {
            // Clear outer bounds
            ctx.fillStyle = '#1e293b'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Wooden Court Area
            const courtX = 100;
            const courtY = 50;
            const courtWidth = 800;
            const courtHeight = 500;
            
            ctx.fillStyle = '#d49a6a'; // Wood color
            ctx.fillRect(courtX, courtY, courtWidth, courtHeight);
            
            // Subtle wood planks styling
            ctx.strokeStyle = '#c48959';
            ctx.lineWidth = 1;
            for (let y = courtY + 20; y < courtY + courtHeight; y += 20) {
                ctx.beginPath();
                ctx.moveTo(courtX, y);
                ctx.lineTo(courtX + courtWidth, y);
                ctx.stroke();
            }

            // White Court Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            
            // Court boundary
            ctx.strokeRect(courtX, courtY, courtWidth, courtHeight);
            
            // Center line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, courtY);
            ctx.lineTo(canvas.width / 2, courtY + courtHeight);
            ctx.stroke();

            // Left Attack Line (3m line)
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 133, courtY);
            ctx.lineTo(canvas.width / 2 - 133, courtY + courtHeight);
            ctx.stroke();

            // Right Attack Line (3m line)
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 + 133, courtY);
            ctx.lineTo(canvas.width / 2 + 133, courtY + courtHeight);
            ctx.stroke();

            // The Net
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, courtY - 10);
            ctx.lineTo(canvas.width / 2, courtY + courtHeight + 10);
            ctx.stroke();

            // Net Antennas
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(canvas.width / 2, courtY - 10, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width / 2, courtY + courtHeight + 10, 5, 0, Math.PI*2); ctx.fill();
        }

        function gameLoop() {
            // Update
            players.forEach(p => p.update());
            
            // Draw
            drawCourt();
            players.forEach(p => p.draw(ctx));
            
            requestAnimationFrame(gameLoop);
        }

        // Initialize Loop
        initTeams();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
