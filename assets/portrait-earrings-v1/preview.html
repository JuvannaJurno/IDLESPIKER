<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portre küpeleri</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#e8eee6;color:#456769;font-family:Arial,sans-serif}main{max-width:860px;margin:auto}h1{font-size:23px;margin:0 0 7px}p{font-size:12px;line-height:1.6;margin:0 0 22px;color:#7a8c7d}.models{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}article{overflow:hidden;border:1px solid #d3dbc8;border-radius:17px;background:#fff9e8}article canvas{display:block;width:100%;height:auto}h2{font-size:13px;text-align:center;margin:10px 0 2px}small{display:block;font-size:10px;text-align:center;color:#87937f;margin:0 0 12px}.detail{background:#f0f1e4;border-top:1px solid #e0e3d3}a{color:inherit}@media(max-width:640px){.models{grid-template-columns:1fr}article{max-width:300px;margin:auto;width:100%}}</style><main><h1>Portre küpeleri</h1><p>Önden portre perspektifi · Küçük ölçekli görünüm ve büyütülmüş detay · Şeffaf PNG çiftleri</p><div class="models"></div></main><script src="../../team-asset-data.js"></script><script src="../../team-appearance.js"></script><script>(async()=>{const manifest=await(await fetch('manifest.json')).json(),base={version:2,earrings:null,parts:structuredClone(TeamAssetData.base),palette:{head:'#eac58e',hair:'#513b2d',shirt:'#63897b'}};for(const p of base.parts){if(p.id==='hair'||p.id.startsWith('brow'))p.tint='#513b2d';}const image=src=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src;});const portrait=await image(TeamAppearance.portrait(base).replace(encodeURIComponent('150 65 300 355'),encodeURIComponent('170 85 260 245')));for(const m of manifest.models){const article=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=520;canvas.height=490;const ctx=canvas.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#fff6df';ctx.fillRect(0,0,260,245);ctx.drawImage(portrait,0,0,260,245);const sprite=await image(m.file),size=m.portraitSize;for(const [piece,mount]of [[m.left,manifest.portraitCanvas.leftMount],[m.right,manifest.portraitCanvas.rightMount]])ctx.drawImage(sprite,piece.x,piece.y,piece.width,piece.height,mount.x-170-size.width/2,mount.y-85,size.width,size.height);const title=document.createElement('h2');title.textContent=m.label;const sub=document.createElement('small');sub.textContent='Sağ + sol çift · PNG';const detail=document.createElement('canvas');detail.className='detail';detail.width=520;detail.height=176;const dc=detail.getContext('2d');dc.scale(2,2);const h=42,w=h*m.left.width/m.left.height;for(const [piece,cx]of [[m.left,97],[m.right,163]])dc.drawImage(sprite,piece.x,piece.y,piece.width,piece.height,cx-w/2,22,w,h);article.append(canvas,title,sub,detail);document.querySelector('.models').append(article);}window.previewReady=true;})();</script></html>
