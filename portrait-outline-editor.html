<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portre kontur editörü</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9efdf;color:#365e65;font:14px system-ui}header{padding:20px 24px;border-bottom:1px solid #bccdbb}h1{font-size:22px;margin:0 0 6px}p{margin:5px 0;line-height:1.5}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:18px;max-width:1440px;margin:auto}.stage{position:sticky;top:15px;height:76vh;min-height:360px;background:#fff;border:1px solid #b1c3ba;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab}.stage:active{cursor:grabbing}.stage svg{width:100%;height:100%;display:block}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select,input,textarea{font:inherit;color:inherit}button,select{background:#fff7df;border:1px solid #aebfa9;border-radius:8px;padding:9px;cursor:pointer}button:active{transform:translateY(1px)}aside{background:#fff8e5;padding:16px;border:1px solid #c8cfb5;border-radius:14px}h2{font-size:15px;margin:18px 0 10px}label.control{display:block;margin:12px 0}label.control>span{display:flex;justify-content:space-between;gap:8px;font-size:12px}input[type=range]{width:100%;accent-color:#567e6d}input[type=number]{width:85px;background:#fffdf2;border:1px solid #c2cfb4;border-radius:5px;padding:3px}textarea{width:100%;min-height:160px;background:#fffdf4;border:1px solid #b9c8b0;padding:9px;border-radius:8px;font:11px monospace}small{color:#728775}#notice{min-height:22px;font-size:12px}input[type=checkbox]{accent-color:#507963}@media(max-width:760px){main{display:block;padding:10px}.stage{position:relative;top:0;height:55vh;min-height:280px}aside{margin-top:12px}}
</style><header><h1>Portre kontur editörü</h1><p>Koyu kopyayı hizala. Önizlemede sürükleyerek konumlandır; yakınlaşmak için fare tekerleğini kullan.</p></header><main><section><div id="stage" class="stage" aria-label="Portre önizlemesi"></div><div class="tools"><button id="new">Başka oyuncu</button><select id="view"><option value="portrait">Tam portre</option><option value="right">Sağ yaka</option><option value="left">Sol yaka</option></select><button id="zoomIn">＋</button><button id="zoomOut">−</button><select id="ground"><option value="#ffffff">Beyaz zemin</option><option value="#e9efdf">Menü zemini</option><option value="#365765">Koyu zemin</option></select></div><small>Bu dosyadaki ayarlar oyunu değiştirmez. Kodu kopyalayıp bana gönderebilirsin.</small></section><aside><h2>Koyu kopya</h2><div id="controls"></div><label><input id="shadow" type="checkbox" checked> Önceden eklediğimiz portre gölgesi</label><div class="tools"><button id="reset">Sıfırla</button><button id="save">Kaydet</button></div><h2>Ayar kodu</h2><textarea id="code" aria-label="Kontur ayar kodu" spellcheck="false"></textarea><div class="tools"><button id="copy">Kodu kopyala</button><button id="apply">Kodu uygula</button><button id="download">JSON indir</button></div><p id="notice" role="status"></p></aside></main>
<script src="team-asset-data.js"></script><script src="hair-colors.js"></script><script src="profile-hair-data.js"></script><script src="player-arm-gear.js"></script><script src="character-colors.js"></script><script src="team-appearance.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),defaults={version:1,effect:'dark-portrait-copy',scaleX:1.009,scaleY:1.009,offsetX:0,offsetY:0,pivotX:300,pivotY:250,darkness:.55,alpha:1,shadow:true},ranges=[['scaleX','Yatay büyüklük',.95,1.08,.001],['scaleY','Dikey büyüklük',.95,1.08,.001],['offsetX','Yatay konum',-20,20,.1],['offsetY','Dikey konum',-20,20,.1],['pivotX','Merkez X',150,450,1],['pivotY','Merkez Y',100,450,1],['darkness','Renk parlaklığı',0,1,.01],['alpha','Kopya opaklığı',0,1,.01]];let state={...defaults},seed=7,shape,zoom=1,base=[125,65,350,375];try{state={...defaults,...JSON.parse(localStorage.getItem('portrait-copy-editor-v1')||'{}')}}catch{}
for(const [key,title,min,max,step]of ranges){const label=document.createElement('label');label.className='control';label.innerHTML='<span>'+title+'<input type="number" min="'+min+'" max="'+max+'" step="'+step+'" data-number="'+key+'"></span><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" data-range="'+key+'">';for(const input of label.querySelectorAll('input'))input.oninput=()=>{state[key]=Math.min(max,Math.max(min,Number(input.value)||0));render();};$('controls').append(label);}
function makePlayer(){let n=seed;const a=TeamAppearance.generate(()=>((n=Math.imul(n,1664525)+1013904223>>>0)/4294967296));a.parts.find(p=>p.id==='shirt').tint='#29323b';const src=TeamAppearance.portrait(a,{lineArt:false,playerCrop:true,bareArms:true,jerseyAccent:'#e4832a',jerseyNumber:18});const doc=new DOMParser().parseFromString(decodeURIComponent(src.slice(src.indexOf(',')+1)),'image/svg+xml'),svg=doc.documentElement;shape=svg.innerHTML;render();}
function render(){for(const [key]of ranges){document.querySelector('[data-range="'+key+'"]').value=state[key];const input=document.querySelector('[data-number="'+key+'"]');if(document.activeElement!==input)input.value=state[key];}$('shadow').checked=state.shadow;const d=state.darkness,transform='translate('+state.offsetX+' '+state.offsetY+') translate('+state.pivotX+' '+state.pivotY+') scale('+state.scaleX+' '+state.scaleY+') translate('+(-state.pivotX)+' '+(-state.pivotY)+')';$('stage').innerHTML='<svg xmlns="http://www.w3.org/2000/svg"><defs><g id="editor-original">'+shape+'</g><filter id="editor-dark" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="'+d+' 0 0 0 0 0 '+d+' 0 0 0 0 0 '+d+' 0 0 0 0 0 1 0"/></filter><filter id="editor-shadow" x="-30%" y="-30%" width="160%" height="160%"><feMorphology in="SourceAlpha" operator="dilate" radius="8.5" result="wide"/><feFlood flood-color="#263e4a" flood-opacity=".15"/><feComposite in2="wide" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g '+(state.shadow?'filter="url(#editor-shadow)"':'')+'><use href="#editor-original" transform="'+transform+'" filter="url(#editor-dark)" opacity="'+state.alpha+'"/><use href="#editor-original"/></g></svg>';setView();$('code').value=JSON.stringify(state,null,2);}
function setView(){const [x,y,w,h]=base;$('stage').querySelector('svg').setAttribute('viewBox',[x+w/2-w/zoom/2,y+h/2-h/zoom/2,w/zoom,h/zoom].join(' '));}
$('view').onchange=()=>{base=$('view').value==='right'?[325,265,80,65]:$('view').value==='left'?[195,265,80,65]:[125,65,350,375];zoom=1;setView();};$('zoomIn').onclick=()=>{zoom=Math.min(8,zoom*1.25);setView();};$('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom/1.25);setView();};$('stage').onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(8,zoom*(e.deltaY<0?1.1:1/1.1)));setView();};let drag=null;$('stage').onpointerdown=e=>{const svg=$('stage').querySelector('svg'),m=svg.getScreenCTM().inverse(),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);drag={x:p.x,y:p.y,ox:state.offsetX,oy:state.offsetY,m};$('stage').setPointerCapture(e.pointerId);};$('stage').onpointermove=e=>{if(!drag)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.m);state.offsetX=Math.max(-20,Math.min(20,Math.round((drag.ox+p.x-drag.x)*10)/10));state.offsetY=Math.max(-20,Math.min(20,Math.round((drag.oy+p.y-drag.y)*10)/10));render();};$('stage').onpointerup=$('stage').onpointercancel=()=>drag=null;
$('new').onclick=()=>{seed++;makePlayer();};$('ground').onchange=()=>{$('stage').style.background=$('ground').value;};$('shadow').onchange=()=>{state.shadow=$('shadow').checked;render();};$('reset').onclick=()=>{state={...defaults};render();};$('save').onclick=()=>{try{localStorage.setItem('portrait-copy-editor-v1',JSON.stringify(state));$('notice').textContent='Bu tarayıcıya kaydedildi.';}catch{$('notice').textContent='Kaydedilemedi; kodu kopyalayabilirsin.';}};$('apply').onclick=()=>{try{const data=JSON.parse($('code').value);for(const [k,,min,max]of ranges){if(typeof data[k]!=='number'||!Number.isFinite(data[k])||data[k]<min||data[k]>max)throw Error(k);}state={...defaults,...Object.fromEntries(ranges.map(([k])=>[k,data[k]])),shadow:data.shadow!==false};render();$('notice').textContent='Ayarlar uygulandı.';}catch{$('notice').textContent='Kod veya değer aralığı geçersiz.';}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);$('notice').textContent='Kopyalandı.';}catch{$('code').select();$('notice').textContent='Ctrl+C ile kopyalayabilirsin.';}};$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([$('code').value],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='portrait-outline.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};makePlayer();
</script></html>
